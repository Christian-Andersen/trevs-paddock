<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4a7c3a" />
    <meta
      name="description"
      content="Trev's paddock — a tiny Stardew-inspired horse sim. Watch Trev wander, graze, snack and think."
    />
    <title>Trev's Paddock</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐴</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud">
        <div id="title">TREV'S PADDOCK</div>
        <div id="clock">☀ 07:55</div>
        <button id="follow" type="button" title="Follow Trev">◎ TREV</button>
        <div id="hint">scroll to zoom · drag to pan · tap a horse · space = fast time</div>
      </div>
      <div id="thought" aria-live="polite"></div>
      <div id="panel" class="hidden" role="group" aria-label="Horse stats">
        <div id="panel-head">
          <span id="panel-name">TREV</span>
          <button id="panel-x" type="button" aria-label="Close stats">×</button>
        </div>
        <div class="mrow"><span>Belly</span><div class="meter"><i id="m-belly"></i></div></div>
        <div class="mrow"><span>Water</span><div class="meter"><i id="m-water"></i></div></div>
        <div class="mrow"><span>Rest</span><div class="meter"><i id="m-rest"></i></div></div>
        <div class="mrow"><span>Fun</span><div class="meter"><i id="m-fun"></i></div></div>
        <div class="mrow"><span>Social</span><div class="meter"><i id="m-social"></i></div></div>
        <div id="panel-counts"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
