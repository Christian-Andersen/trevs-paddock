on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@v23
      - name: Run CI
        run: |
          nix develop --command npm ci
          nix develop --command just ci
  update-and-deploy:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@v23
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ forgejo.event.repository.name }}
        run: |
          nix develop --command npm ci
          nix develop --command just build
          # TEMPORARY: first-run project creation. `pages project create` fails
          # if the project already exists, so only create when it is missing.
          # Safe to delete this line once the project exists on Cloudflare.
          nix develop --command bash -c '
            if ! npx wrangler pages project list | grep -qw "$PROJECT"; then
              echo "Creating Cloudflare Pages project: $PROJECT"
              npx wrangler pages project create "$PROJECT" --production-branch main
            else
              echo "Cloudflare Pages project already exists: $PROJECT"
            fi'
          nix develop --command npx wrangler pages deploy ./dist --project-name="$PROJECT" --commit-dirty=true
